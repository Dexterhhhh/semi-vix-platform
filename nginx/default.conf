server {
  listen 80;
  server_name _;
  # Resolve Compose service names continuously. Without a variable, nginx
  # keeps the container IP resolved at startup and returns 502 after a backend
  # or frontend container is recreated with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:80;
  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /health {
    proxy_pass http://$backend_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
